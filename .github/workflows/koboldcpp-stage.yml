name: Stage KoboldCpp integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/portable-koboldcpp'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply narrow setup and README integration
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'setup.ps1'
          $source = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $anchor = "`nInitialize-SetupStorage`nShow-StartupProgressHeader`n"
          if ($source.Split(@($anchor), [StringSplitOptions]::None).Count -ne 2) { throw 'Unexpected setup entry point' }
          $function = @'
          function Ensure-KoboldCppIntegration {
              $root = Join-Path $limeNowAppsRoot 'KoboldCpp'
              $manager = Join-Path $root 'koboldcpp.ps1'
              $candidate = $null
              try {
                  New-Item -ItemType Directory -Path $root -Force | Out-Null
                  $candidate = Join-Path $root ('manager-' + [Guid]::NewGuid().ToString('N') + '.ps1')
                  $localSource = Join-Path $PSScriptRoot 'koboldcpp.ps1'
                  if (Test-Path -LiteralPath $localSource -PathType Leaf) {
                      Copy-Item -LiteralPath $localSource -Destination $candidate
                      Assert-PowerShellScriptSyntax -Path $candidate -Description 'KoboldCpp manager'
                  }
                  else {
                      Get-LimeNowManagedScriptCandidate -LocalPath $manager `
                          -RemoteUrl 'https://raw.githubusercontent.com/JohnDeved/LimeNow/main/koboldcpp.ps1' `
                          -CandidatePath $candidate -Description 'KoboldCpp manager'
                  }
                  if ((Get-Content -LiteralPath $candidate -Raw) -notmatch '(?m)^# LIMENOW_KOBOLDCPP_SCRIPT\r?$') {
                      throw 'The downloaded file is not a recognized KoboldCpp manager.'
                  }
                  if (Test-Path -LiteralPath $manager -PathType Leaf) {
                      if ((Get-FileHash -LiteralPath $manager).Hash -ne (Get-FileHash -LiteralPath $candidate).Hash) {
                          [IO.File]::Replace($candidate, $manager, "$manager.previous", $true)
                      }
                  }
                  else { [IO.File]::Move($candidate, $manager) }
                  # Repair is noninteractive and never downloads the executable or a model.
                  & $manager -Action Repair -Root $root
                  Write-SetupLog 'Verified optional KoboldCpp desktop launcher. Open it to install local AI.'
              }
              catch {
                  # An optional AI integration must not prevent the rest of the session setup.
                  Write-SetupLog "WARNING: KoboldCpp integration is unavailable. $($_.Exception.Message)"
              }
              finally {
                  if ($candidate -and (Test-Path -LiteralPath $candidate)) {
                      Remove-Item -LiteralPath $candidate -Force -ErrorAction SilentlyContinue
                  }
              }
          }
          '@
          $source = $source.Replace($anchor, "`n$function`n$anchor")
          $call = "    Ensure-DeveloperDesktopShortcuts`n"
          if ($source.Split(@($call), [StringSplitOptions]::None).Count -ne 2) { throw 'Unexpected desktop setup call' }
          $source = $source.Replace($call, $call + "    Ensure-KoboldCppIntegration`n")
          [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))
          $readmePath = Join-Path $PWD 'README.md'
          $readme = [IO.File]::ReadAllText($readmePath).Replace("`r`n", "`n")
          $heading = '### Remote development preview'
          if ($readme.Split(@($heading), [StringSplitOptions]::None).Count -ne 2) { throw 'Unexpected README structure' }
          $section = @'
          ### Local AI (optional)

          The **KoboldCpp** desktop shortcut opens a standalone model/backend picker
          and bundled chat UI. Its first launch offers to download the official,
          checksum-verified portable Windows x64 application. Session startup does
          not download the application or any model and does not start an AI server.
          Models, saved configurations and explicit server-side chat saves live under
          `I:\Apps\LimeNow\KoboldCpp`; no Python, CUDA Toolkit, administrator access,
          Windows service or inbound firewall rule is requested.

          GPU compute access and model memory must still be checked on the assigned
          GFN rig. See [KoboldCpp setup, persistence and compatibility](docs/koboldcpp.md)
          and [Windows integration tests](tools/Test-KoboldCpp.ps1). This is not a
          claim that a 31B model has been tested on GeForce NOW.

          '@
          $readme = $readme.Replace($heading, $section + "`n" + $heading)
          [IO.File]::WriteAllText($readmePath, $readme, [Text.UTF8Encoding]::new($false))
      - name: Windows PowerShell 5.1 regression checks
        shell: powershell
        run: |
          .\tools\Test-KoboldCpp.ps1
          .\tools\Test-StartupExperience.ps1
          .\tools\Test-ToolUpdates.ps1
      - name: Official executable and loopback UI smoke test
        shell: powershell
        run: .\tools\Test-KoboldCpp.ps1 -LiveDownload
      - name: Store validated integration blobs for the PR commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($file in @('setup.ps1', 'README.md')) {
            $payload = @{ encoding = 'base64'; content = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $file))) } | ConvertTo-Json -Compress
            $sha = $payload | gh api 'repos/JohnDeved/LimeNow/git/blobs' --method POST --input - --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[a-f0-9]{40}$') { throw "Could not store $file" }
            Write-Host "VALIDATED_BLOB $file $sha"
          }
